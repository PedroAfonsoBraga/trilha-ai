[project]
name = "trilha-backend"
version = "0.1.0"
description = "Trilha — SaaS Educacional com IA (Backend)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "supabase>=2.0.0",
    "stripe>=10.0.0",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    "structlog>=24.0.0",
    "python-dotenv>=1.0.0",
    "python-multipart>=0.0.9",
    "pymupdf>=1.24.0",
    "python-docx>=1.1.0",
    "ics>=0.7.0",
    "openai>=1.0.0",
    "pytesseract>=0.3.0",
    "genanki>=0.13.0",
    "resend>=2.0.0",
    "sse-starlette>=3.4.4",
    "sentry-sdk[fastapi]>=2.63.0",
    "llama-parse>=0.6.94",
    "prometheus-fastapi-instrumentator>=8.0.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-httpx>=0.30.0",
]

[dependency-groups]
dev = [
    "psycopg2-binary>=2.9.12",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.4.0",
    "pytest-httpx>=0.36.2",
]
